<!DOCTYPE html>
<html>
<head>
    <script src='https://aframe.io/releases/1.7.0/aframe.min.js'></script>
    <script src='https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js'></script>
</head>
<body>
    <a-scene>
        <a-camera position="0 3 6">
        </a-camera>
        
        //탁자
        <a-cylinder static-body position="-2 1 2" radius="0.2" height="2" color="#e0bd77" src="Wall_Stone_albedo.jpg">
        </a-cylinder>
        <a-cylinder static-body position="-2 1 -2" radius="0.2" height="2" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="2 1 2" radius="0.2" height="2" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="2 1 -2" radius="0.2" height="2" color="#e0bd77">
        </a-cylinder>
        <a-box static-body position="0 2 0" rotation="-90 0 0" width="4.5" height="4.5" depth="0.3" color="#c7a35b">
        </a-box>

        //의자 1
        <a-cylinder static-body position="4 0.5 0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="4 0.5 -0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="5 0.5 0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="5 0.5 -0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-box static-body position="4.5 1 0" rotation="-90 0 0" width="1.2" height="1.2" depth="0.15" color="#c7a35b">
        </a-box>

        //의자 2
        <a-cylinder static-body position="-4 0.5 0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="-4 0.5 -0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="-5 0.5 0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-cylinder static-body position="-5 0.5 -0.5" radius="0.1" height="1" color="#e0bd77">
        </a-cylinder>
        <a-box static-body position="-4.5 1 0" rotation="-90 0 0" width="1.2" height="1.2" depth="0.15" color="#c7a35b">
        </a-box>

        //여우
        <a-cylinder static-body position="-4.5 1.7 0" radius="0.7" height="1.3" color="#cc6f2d">
        </a-cylinder>
        <a-sphere static-body position="-4.5 3 0" radius="1" color="#cc6f2d">
        </a-sphere>
        <a-cylinder static-body position="-3.8 2.5 0.7" rotation="30 0 -45" radius="0.2" height="1.3" color="#cc6f2d">
        </a-cylinder>
        <a-cylinder static-body position="-3.8 2.5 -0.7" rotation="-30 0 -45" radius="0.2" height="1.3" color="#cc6f2d">
        </a-cylinder>
        <a-sphere static-body position="-3.3 3 0.9" radius="0.3" color="#cc6f2d">
        </a-sphere>
        <a-sphere static-body position="-3.3 3 -0.9" radius="0.3" color="#cc6f2d">
        </a-sphere>
        <a-cylinder static-body position="-3.8 1 0.5" rotation="-30 0 80" radius="0.2" height="1.3" color="#cc6f2d">
        </a-cylinder>
        <a-cylinder static-body position="-3.8 1 -0.5" rotation="30 0 80" radius="0.2" height="1.3" color="#cc6f2d">
        </a-cylinder>
        <a-cylinder static-body position="-3.2 1 0.6" rotation="-30 0 80" radius="0.3" height="0.2" color="#cc6f2d">
        </a-cylinder>
        <a-cylinder static-body position="-3.2 1 -0.6" rotation="30 0 80" radius="0.3" height="0.2" color="#cc6f2d">
        </a-cylinder>
        <a-cylinder static-body position="-3.7 3 0" rotation="0 0 15" radius="0.5" height="0.15" color="#cc6f2d">
        </a-cylinder>
        <a-cylinder static-body position="-3.7 2.8 0" rotation="0 0 -15" radius="0.5" height="0.15" color="#cc6f2d">
        </a-cylinder>
        <a-box static-body position="-4.7 3.6 -0.4" rotation="0 90 10" width="0.8" height="0.8" depth="0.1" color="#cc6f2d">
        </a-box>
        <a-box static-body position="-4.7 3.6 0.4" rotation="0 90 -10" width="0.8" height="0.8" depth="0.1" color="#cc6f2d">
        </a-box>
        <a-cone static-body position="-5.5 1.3 0" rotation="0 0 -120" radius-bottom="0.5" radius-top="0" height="1" color="#cc6f2d">
        </a-cone>
        <a-cone static-body position="-6.35 1.79 0" rotation="180 180 -120" radius-bottom="0.5" radius-top="0" height="1" color="#cc6f2d">
        </a-cone>

        //두루미
        <a-sphere static-body position="4.2 4 0" radius="0.5" color="#f7fcfc">
        </a-sphere>
        <a-cone static-body position="3.6 3.8 0" rotation="0 0 90" radius-bottom="0.1" radius-top="0" height="1" color="#ffcf33">
        </a-cone>
        <a-cylinder static-body position="4.3 3 0" radius="0.15" height="2" color="#f7fcfc">
        </a-cylinder>
        <a-cylinder static-body position="4.8 1.5 0" rotation="90 90 0" radius="0.6" height="1.3" color="#f7fcfc">
        </a-cylinder>
        <a-cone static-body position="5.9 1.5 0" rotation="0 0 -90" radius-bottom="0.6" radius-top="0" height="1" color="#f7fcfc">
        </a-cone>
        <a-cylinder static-body position="3.8 1.1 0.3" rotation="30 0 -80" radius="0.1" height="1.3" color="#ffcf33">
        </a-cylinder>
        <a-cylinder static-body position="3.8 1.1 -0.3" rotation="-30 0 -80" radius="0.1" height="1.3" color="#ffcf33">
        </a-cylinder>
        <a-cylinder static-body position="3.2 1.1 0.4" rotation="30 0 -80" radius="0.3" height="0.1" color="#ffcf33">
        </a-cylinder>
        <a-cylinder static-body position="3.2 1.1 -0.4" rotation="-30 0 -80" radius="0.3" height="0.1" color="#ffcf33">
        </a-cylinder>

        //접시
        <a-cylinder static-body position="-2.7 3.1 0" rotation="0 0 20" radius="0.8" height="0.07" color="#f2f6fa">
        </a-cylinder>

        //음식
        <a-cylinder static-body position="-3.1 3 0" rotation="0 0 20" radius="0.5" height="0.1" color="#e6df65">
        </a-cylinder>

        //접시 2
        <a-cylinder static-body position="1.5 2.2 0" radius="0.8" height="0.07" color="#f2f6fa">
        </a-cylinder>

        //음식 2
        <a-cylinder static-body position="1.5 2.3 0" radius="0.5" height="0.1" color="#e6df65">
        </a-cylinder>






    </a-scene>
</body>
</html>
